name: Maybe release to npm (Continious Deployment)

on:
  push:
    branches:
      - gen0

permissions:
  contents: write # To push commits and tags
  id-token: write # CRITICAL: For NPM Provenance

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      # 1. AUTHENTICATION: Generate the App Token
      - name: Generate Release Token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}

      # 2. CHECKOUT: Use the App Token for checkout
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for Nx to calculate changes
          token: ${{ steps.app-token.outputs.token }}

      # 3. SETUP: Environment
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.8.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # 4. CONFIG: Git User (Impersonate the Bot)
      - name: Configure Git User
        run: |
          git config --global user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git config --global user.name "${{ steps.app-token.outputs.app-slug }}[bot]"

      # 5. VERSIONING: Calculate versions, update package.json, changelog, commit, & tag
      - name: Version & Tag
        run: pnpm exec nx release version
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      # 6. SYNC: Push the new commit and tags to GitHub
      - name: Push Changes
        run: git push --follow-tags origin gen0

      # 7. BUILD: Explicitly build projects
      # We do this AFTER versioning so artifacts have the correct version.
      # We do this instead of 'prepublishOnly' to avoid stdout pollution.
      - name: Build All Projects
        run: pnpm exec nx run-many -t build

      # 8. PUBLISHING: Publish to NPM and Create GitHub Release
      - name: Publish to NPM & GitHub
        run: |
          # 1. Manually create .npmrc
          # Since we removed 'registry-url' from setup-node, we must create this file manually.
          echo "@settings-manager:registry=https://registry.npmjs.org/" > .npmrc.ci
          echo "registry=https://registry.npmjs.org/" >> .npmrc.ci

          # pnpm v9+ supports provenance and should handle the OIDC exchange.
          # https://github.com/actions/setup-node/issues/1440#issuecomment-3571890875
          pnpm exec nx release publish --yes
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_CONFIG_PROVENANCE: true
          # Force npm to use our manual config
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc.ci
          # Explicitly clear NODE_AUTH_TOKEN to ensure OIDC is used
          NODE_AUTH_TOKEN: ''
