name: Automated Independent Release Pipeline

on:
  push:
    branches:
      - gen0

permissions:
  contents: write # To push commits and tags
  id-token: write # CRITICAL: For NPM Provenance

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      # 1. AUTHENTICATION: Generate the App Token
      - name: Generate Release Token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}

      # 2. CHECKOUT: Use the App Token for checkout
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for Nx to calculate changes
          token: ${{ steps.app-token.outputs.token }}

      # 3. SETUP: Environment
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.8.0 # Or your preferred version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org/'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # 4. CONFIG: Git User (Impersonate the Bot)
      - name: Configure Git User
        run: |
          git config --global user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git config --global user.name "${{ steps.app-token.outputs.app-slug }}[bot]"

      # 5. VERSIONING: Calculate versions, update package.json, changelog, commit, & tag
      # We skip publishing here to allow us to push to git first
      - name: Version & Tag
        run: pnpm exec nx release version --yes
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      # 6. SYNC: Push the new commit and tags to GitHub
      # This ensures that when we publish, the tags exist on the remote
      - name: Push Changes
        run: git push --follow-tags origin gen0

      # 7. PUBLISHING: Publish to NPM and Create GitHub Release
      - name: Publish to NPM & GitHub
        run: pnpm exec nx release publish --yes
        env:
          # Token for NPM Registry
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
          # Token for creating GitHub Releases (if configured in nx.json)
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # Enable Provenance
          NPM_CONFIG_PROVENANCE: true
